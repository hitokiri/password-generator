name: Build Desktop App

on:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v3

      - name: Sync dependencies
        run: uv sync --extra build

      - name: Build executable
        run: |
          uv run pyinstaller --noconfirm --onefile --windowed --name password-generator-${{ github.ref_name }} main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: password-generator-${{ github.ref_name }}-${{ matrix.os }}
          path: dist/*
