name: Build Desktop App

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v3

      - name: Sync dependencies
        run: uv sync --extra build

      - name: Build executable
        shell: bash
        run: |
          uv run pyinstaller --noconfirm --onefile --windowed --name password-generator main.py

      - name: Package release asset
        id: package
        shell: bash
        run: |
          set -euo pipefail

          APP_NAME="password-generator"
          VERSION="${GITHUB_REF_NAME#v}"

          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp "dist/${APP_NAME}.exe" "${APP_NAME} ${VERSION} windows.exe"
            ASSET_PATH="${APP_NAME} ${VERSION} windows.exe"
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            cp "dist/${APP_NAME}" "${APP_NAME} ${VERSION} macos"
            tar -czf "${APP_NAME} ${VERSION} macos.tar.gz" "${APP_NAME} ${VERSION} macos"
            ASSET_PATH="${APP_NAME} ${VERSION} macos.tar.gz"
          else
            cp "dist/${APP_NAME}" "${APP_NAME} ${VERSION} linux"
            tar -czf "${APP_NAME} ${VERSION} linux.tar.gz" "${APP_NAME} ${VERSION} linux"
            ASSET_PATH="${APP_NAME} ${VERSION} linux.tar.gz"
          fi

          echo "asset_path=$ASSET_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: ${{ steps.package.outputs.asset_path }}

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          name: password-generator ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: release-assets/*
          generate_release_notes: true
