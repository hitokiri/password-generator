name: Build Desktop App

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v3

      - name: Sync dependencies
        run: uv sync --extra build

      - name: Build executable
        shell: bash
        run: |
          uv run pyinstaller --noconfirm --onefile --windowed --name password-generator main.py

      - name: Package release asset
        id: package
        shell: bash
        run: |
          set -euo pipefail

          APP_NAME="password-generator"
          VERSION="${GITHUB_REF_NAME#v}"

          if [[ "$RUNNER_OS" == "Windows" ]]; then
            ASSET_PATH="${APP_NAME}.${VERSION}.windows.exe"
            cp "dist/${APP_NAME}.exe" "$ASSET_PATH"
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            # --windowed makes PyInstaller emit a real .app bundle on macOS; ship that, not the raw binary inside it.
            ASSET_PATH="${APP_NAME}.${VERSION}.macos.zip"
            (cd dist && zip -r -q "../${ASSET_PATH}" "${APP_NAME}.app")
          else
            ASSET_PATH="${APP_NAME}.${VERSION}.linux"
            cp "dist/${APP_NAME}" "$ASSET_PATH"
            chmod +x "$ASSET_PATH"
          fi

          echo "asset_path=$ASSET_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: ${{ steps.package.outputs.asset_path }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts into release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          name: password-generator ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: release/*
          generate_release_notes: true
